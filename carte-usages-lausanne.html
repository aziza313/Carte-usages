<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Carte des usages · Lausanne</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --creme:#FFF8EE;
  --papier:#FFFFFF;
  --encre:#2B2118;
  --encre-doux:#8A7A68;
  --corail:#FF5A46;
  --corail-sombre:#E0402D;
  --soleil:#FFC93C;
  --ciel:#3FA9E0;
  --feuille:#4CAF6D;
  --ligne:#F0E4D3;
  --ombre:0 6px 20px -6px rgba(43,33,24,.25);
  --rayon:18px;
  --titre:"Fredoka",system-ui,sans-serif;
  --texte:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--creme);color:var(--encre);
  font-family:var(--texte);font-size:15px;line-height:1.45;
  display:flex;flex-direction:column;overflow:hidden;-webkit-text-size-adjust:100%;
}

/* ---------- bandeau ---------- */
.bandeau{
  background:var(--corail);color:#fff;flex:0 0 auto;
  display:flex;align-items:center;gap:12px;padding:12px 18px;
  box-shadow:var(--ombre);position:relative;z-index:20;
}
.bandeau .bulle{
  width:42px;height:42px;border-radius:50%;background:#fff;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:22px;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.08);
}
.bandeau h1{font-family:var(--titre);font-weight:700;font-size:19px;letter-spacing:-.01em;margin:0}
.bandeau h1 span{display:block;font-family:var(--texte);font-size:12px;font-weight:700;letter-spacing:.03em;opacity:.9}
.bandeau .pousse{margin-left:auto;display:flex;align-items:center;gap:8px}
.pastille-etape{
  font-family:var(--texte);font-weight:800;font-size:12px;background:rgba(255,255,255,.22);
  color:#fff;padding:6px 12px;border-radius:999px;white-space:nowrap;
}

/* ---------- barre d'info (flux normal, sous le bandeau) ---------- */
.barre-info{
  flex:0 0 auto;background:var(--papier);border-bottom:1px solid var(--ligne);
  padding:10px 16px;font-size:13px;color:var(--encre-doux);position:relative;z-index:15;
}
.barre-info strong{color:var(--encre);font-family:var(--titre);font-weight:600;margin-right:6px}
.barre-info.mode-dessin{background:var(--encre);color:#fff;border-bottom-color:var(--encre)}
.barre-info.mode-dessin strong{color:#fff}

/* ---------- carte (occupe tout l'espace restant) ---------- */
main{flex:1 1 auto;position:relative;min-height:0}
#carte{position:absolute;inset:0;background:#DDEBF2}

.leaflet-container{font-family:var(--texte)}
.leaflet-control-zoom a{
  border-radius:12px !important;color:var(--corail) !important;font-weight:800 !important;
}
.leaflet-control-layers{
  border-radius:var(--rayon) !important;border:none !important;box-shadow:var(--ombre) !important;
  font-family:var(--texte);padding:8px 10px !important;
}
.leaflet-bar{border:none !important;box-shadow:var(--ombre) !important;border-radius:12px !important;overflow:hidden}
#carte.mode-dessin{cursor:crosshair;touch-action:none}
#carte.mode-dessin .leaflet-container{cursor:crosshair}

/* ---------- barre du bas (flux normal, toujours visible) ---------- */
.barre-bas{
  flex:0 0 auto;background:var(--papier);border-top:1px solid var(--ligne);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 16px -10px rgba(43,33,24,.3);position:relative;z-index:20;
}
.groupe-bas{display:flex;align-items:center;gap:10px;width:100%}
.groupe-bas[hidden]{display:none}
.surface-info{font-family:var(--titre);font-weight:600;font-size:14.5px;color:var(--encre);flex:1;min-width:0}
.surface-info b{color:var(--corail)}

button.bouton-flottant{
  background:var(--papier);color:var(--encre);
  border:2px solid var(--ligne);border-radius:999px;padding:11px 18px;font-family:var(--texte);font-weight:800;font-size:13.5px;
  cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;flex:0 0 auto;
}
button.bouton-flottant:hover{background:#FFF3E4}
button.bouton-flottant.principal{background:var(--corail);color:#fff;border-color:var(--corail)}
button.bouton-flottant.principal:hover{background:var(--corail-sombre);border-color:var(--corail-sombre)}
button.bouton-flottant.sombre{background:var(--encre);color:#fff;border-color:var(--encre)}
#btn-dessiner{margin-left:auto}
#groupe-carte #btn-recentrer{flex:0 0 auto}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="bandeau">
  <span class="bulle">🗺️</span>
  <h1>Carte des usages<span>Ville de Lausanne</span></h1>
  <div class="pousse">
    <span class="pastille-etape">Étape 1 · Choisis ton coin de la ville</span>
  </div>
</header>

<div class="barre-info" id="barre-info">
  <strong>Zoome sur ton coin</strong>
  <span id="texte-info">Balade-toi sur la carte et rapproche-toi de l'endroit dont tu veux parler, puis touche « Mon quartier » en bas.</span>
</div>

<main>
  <div id="carte" role="application" aria-label="Carte de Lausanne. Déplace-toi et zoome pour choisir la zone qui t'intéresse, puis dessine les limites de ton quartier."></div>
</main>

<footer class="barre-bas">
  <div class="groupe-bas" id="groupe-carte">
    <button type="button" class="bouton-flottant principal" id="btn-recentrer">↺ Recentrer</button>
    <button type="button" class="bouton-flottant principal" id="btn-dessiner">✏️ Mon quartier</button>
  </div>
  <div class="groupe-bas" id="groupe-quartier" hidden>
    <div class="surface-info" id="texte-surface">Ton quartier fait environ <b>0 m²</b></div>
    <button type="button" class="bouton-flottant" id="btn-recommencer">↺ Refaire</button>
    <button type="button" class="bouton-flottant principal" id="btn-valider-quartier">✓ Valider</button>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const LAUSANNE_CENTRE = [46.5197, 6.6323];
const LAUSANNE_ZOOM_DEPART = 14;

const FONDS = [
  { id:'couleur', libelle:'Carte colorée', natif:19,
    url:'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',
    credit:'© swisstopo' },
  { id:'ortho', libelle:'Photo aérienne', natif:20,
    url:'https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.swissimage/default/current/3857/{z}/{x}/{y}.jpeg',
    credit:'© swisstopo' },
  { id:'osm', libelle:'OpenStreetMap', natif:19,
    url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    credit:'© contributrices et contributeurs OpenStreetMap' }
];

const carte = L.map('carte', {
  center: LAUSANNE_CENTRE, zoom: LAUSANNE_ZOOM_DEPART,
  minZoom: 11, maxZoom: 20, zoomControl: true
});

L.control.scale({ imperial:false, position:'bottomright', maxWidth:120 }).addTo(carte);

const couches = {};
FONDS.forEach(function (f) {
  couches[f.libelle] = L.tileLayer(f.url, { maxZoom:20, maxNativeZoom:f.natif, attribution:f.credit });
});
couches[FONDS[0].libelle].addTo(carte);
L.control.layers(couches, null, { position:'topright', collapsed:true }).addTo(carte);

document.getElementById('btn-recentrer').addEventListener('click', function () {
  carte.flyTo(LAUSANNE_CENTRE, LAUSANNE_ZOOM_DEPART, { duration:0.6 });
});

/* ============================================================================
   ÉTAPE 2 · dessin à main levée du quartier perçu
   ========================================================================== */
const carteEl = carte.getContainer();
const boutonDessiner = document.getElementById('btn-dessiner');
const boutonRecentrer = document.getElementById('btn-recentrer');
const barreInfo = document.getElementById('barre-info');
const texteInfo = document.getElementById('texte-info');
const groupeCarte = document.getElementById('groupe-carte');
const groupeQuartier = document.getElementById('groupe-quartier');
const texteSurface = document.getElementById('texte-surface');

const MESSAGE_IDLE = texteInfo.textContent;
const MESSAGE_DESSIN = "Trace le contour avec ta souris ou ton doigt — pas besoin d'être précis·e ! Touche « Annuler » pour arrêter.";
const MESSAGE_TROP_PETIT = 'Trace un contour un peu plus grand 🙂 Réessaie !';

let modeDessin = false;
let enTrainDeTracer = false;
let pointsTrace = [];
let ligneTrace = null;
let quartierPolygone = null;
let quartierValide = false;

function metresLat(dLat) { return dLat * 111320; }
function metresLng(dLng, lat) { return dLng * 111320 * Math.cos(lat * Math.PI / 180); }

function surfaceApprox(latlngs) {
  if (latlngs.length < 3) return 0;
  const latMoy = latlngs.reduce(function (s, p) { return s + p.lat; }, 0) / latlngs.length;
  const pts = latlngs.map(function (p) { return [metresLng(p.lng, latMoy), metresLat(p.lat)]; });
  let aire = 0;
  for (let i = 0; i < pts.length; i++) {
    const a = pts[i], b = pts[(i + 1) % pts.length];
    aire += a[0] * b[1] - b[0] * a[1];
  }
  return Math.abs(aire / 2);
}
function formaterSurface(m2) {
  if (m2 < 10000) return Math.round(m2).toLocaleString('fr-CH') + ' m²';
  return (m2 / 10000).toLocaleString('fr-CH', { maximumFractionDigits: 1 }) + ' hectares';
}

function pointDepuisEvenement(e) {
  const rect = carteEl.getBoundingClientRect();
  return carte.containerPointToLatLng(L.point(e.clientX - rect.left, e.clientY - rect.top));
}

function demarrerDessin() {
  modeDessin = true;
  pointsTrace = [];
  if (quartierPolygone) { quartierPolygone.remove(); quartierPolygone = null; }
  quartierValide = false;
  carteEl.classList.add('mode-dessin');
  carte.dragging.disable();
  carte.doubleClickZoom.disable();
  if (carte.tap) carte.tap.disable();
  boutonDessiner.classList.add('sombre');
  boutonDessiner.textContent = '✕ Annuler';
  boutonRecentrer.hidden = true;
  groupeQuartier.hidden = true;
  groupeCarte.hidden = false;
  barreInfo.classList.add('mode-dessin');
  texteInfo.textContent = MESSAGE_DESSIN;
  carteEl.addEventListener('pointerdown', surPointerDown);
  carte.invalidateSize();
}

function arreterModeDessin() {
  modeDessin = false;
  enTrainDeTracer = false;
  carteEl.classList.remove('mode-dessin');
  carte.dragging.enable();
  carte.doubleClickZoom.enable();
  if (carte.tap) carte.tap.enable();
  boutonDessiner.classList.remove('sombre');
  boutonDessiner.textContent = '✏️ Mon quartier';
  boutonRecentrer.hidden = false;
  carteEl.removeEventListener('pointerdown', surPointerDown);
  carteEl.removeEventListener('pointermove', surPointerMove);
  window.removeEventListener('pointerup', surPointerUp);
}

function annulerDessin() {
  if (ligneTrace) { ligneTrace.remove(); ligneTrace = null; }
  pointsTrace = [];
  arreterModeDessin();
  barreInfo.classList.remove('mode-dessin');
  texteInfo.textContent = MESSAGE_IDLE;
}

boutonDessiner.addEventListener('click', function () {
  if (modeDessin) { annulerDessin(); return; }
  demarrerDessin();
});

function surPointerDown(e) {
  if (!modeDessin) return;
  e.preventDefault();
  enTrainDeTracer = true;
  pointsTrace = [pointDepuisEvenement(e)];
  if (ligneTrace) ligneTrace.remove();
  ligneTrace = L.polyline(pointsTrace, {
    color: '#3FA9E0', weight: 4, opacity: .9, lineCap: 'round', lineJoin: 'round', dashArray: '1 10'
  }).addTo(carte);
  carteEl.addEventListener('pointermove', surPointerMove);
  window.addEventListener('pointerup', surPointerUp);
}

function surPointerMove(e) {
  if (!enTrainDeTracer) return;
  e.preventDefault();
  const rect = carteEl.getBoundingClientRect();
  const actuelPx = L.point(e.clientX - rect.left, e.clientY - rect.top);
  const dernierLatLng = pointsTrace[pointsTrace.length - 1];
  const dernierPx = carte.latLngToContainerPoint(dernierLatLng);
  if (dernierPx.distanceTo(actuelPx) < 6) return;
  pointsTrace.push(carte.containerPointToLatLng(actuelPx));
  ligneTrace.setLatLngs(pointsTrace);
}

function surPointerUp() {
  if (!enTrainDeTracer) return;
  enTrainDeTracer = false;
  carteEl.removeEventListener('pointermove', surPointerMove);
  window.removeEventListener('pointerup', surPointerUp);
  terminerTrace();
}

function terminerTrace() {
  if (pointsTrace.length < 4) {
    if (ligneTrace) { ligneTrace.remove(); ligneTrace = null; }
    pointsTrace = [];
    texteInfo.textContent = MESSAGE_TROP_PETIT;
    setTimeout(function () { if (modeDessin) texteInfo.textContent = MESSAGE_DESSIN; }, 1800);
    return;
  }
  if (ligneTrace) { ligneTrace.remove(); ligneTrace = null; }
  quartierPolygone = L.polygon(pointsTrace, {
    color: '#3FA9E0', weight: 3, fillColor: '#3FA9E0', fillOpacity: .22, lineJoin: 'round', dashArray: '1 8'
  }).addTo(carte);
  arreterModeDessin();
  barreInfo.classList.remove('mode-dessin');
  texteInfo.textContent = "C'est ta perception qui compte, pas une limite officielle 🙂";
  texteSurface.innerHTML = 'Ton quartier fait environ <b>' + formaterSurface(surfaceApprox(pointsTrace)) + '</b>';
  groupeCarte.hidden = true;
  groupeQuartier.hidden = false;
}

document.getElementById('btn-recommencer').addEventListener('click', function () {
  if (quartierPolygone) { quartierPolygone.remove(); quartierPolygone = null; }
  groupeQuartier.hidden = true;
  groupeCarte.hidden = false;
  demarrerDessin();
});

document.getElementById('btn-valider-quartier').addEventListener('click', function () {
  quartierValide = true;
  groupeQuartier.hidden = true;
  groupeCarte.hidden = false;
  texteInfo.textContent = MESSAGE_IDLE;
  if (quartierPolygone) quartierPolygone.setStyle({ dashArray: null, fillOpacity: .14 });
  // l'étape suivante (ajout des points d'usage) viendra se brancher ici
});

setTimeout(function () { carte.invalidateSize(); }, 150);
window.addEventListener('resize', function () { carte.invalidateSize(); });
</script>
</body>
</html>
